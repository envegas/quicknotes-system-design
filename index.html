
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes | Online Notes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>

    <main class="container">
        <header>
            <h1>QuickNotes</h1>
            <p>Your simple online note manager.</p>
        </header>

        <section class="notes-section">
            <div class="section-heading">
                <h2>Your Notes</h2>
                <button id="load-btn" type="button">
                    Load notes
                </button>
            </div>

            <p id="status" role="status" aria-live="polite">
                Click "Load notes" to retrieve your notes.
            </p>

            <form id="note-form">
                <h2>Create a Note</h2>

                <label for="title-input">Note Title</label>
                <input
                    type="text"
                    id="title-input"
                    maxlength="100"
                    required
                    placeholder="Enter note title"
                >

                <label for="body-input">Note Content</label>
                <textarea
                    id="body-input"
                    rows="5"
                    placeholder="Write your note here..."
                ></textarea>

                <button id="submit-btn" type="submit">
                    Create Note
                </button>
            </form>

            <ul id="notes-list"></ul>
        </section>
    </main>

</body>
</html>
